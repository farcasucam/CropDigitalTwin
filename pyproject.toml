[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-digital-twin"
version = "0.1.0"
description = "Agricultural Digital Twin - Phase 0 contracts and foundations"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "paho-mqtt>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]